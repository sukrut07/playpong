# PONG AI — MediaPipe Hand Landmark Temporal Gesture Classifier Config
model:
  name: "temporal_gesture_mlp"
  type: "mlp_classifier"
  input_dim: 126 # 21 landmarks * 3 coords (x,y,z) * 2 (positions + delta velocity)
  sequence_length: 15 # 15 frames sliding window (approx 250ms at 60fps)
  hidden_layers: [128, 64, 32]
  dropout: 0.2
  activation: "relu"
  num_classes: 5
  classes:
    - "IDLE"
    - "READY"
    - "FOREHAND"
    - "BACKHAND"
    - "SMASH"

features:
  normalize_wrist_origin: true
  scale_by_palm_size: true
  include_velocity_delta: true
  min_tracking_confidence: 0.65

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  split_by_session: true # Strictly prevents adjacent frame leakage between splits
